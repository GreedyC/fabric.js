name: Contribution preflight
on:
  push:
    branches: [codex/grouped-text-select-all-preflight]
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: ./.github/actions/cached-install
        with:
          node-version: ${{ matrix.version }}
      - run: pnpm run test:vitest
  browser:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: ./.github/actions/cached-install
        with:
          node-version: 24.x
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: xvfb-run pnpm run test:vitest:${{ matrix.browser }}
        env:
          LIBGL_ALWAYS_SOFTWARE: true
  quality-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: ./.github/actions/cached-install
        with:
          node-version: 24.x
      - run: pnpm run prettier:check
      - run: pnpm run typecheck
      - run: pnpm exec eslint extensions packages --quiet
      - run: pnpm run build
      - run: pnpm run smoke:packages
      - run: pnpm --dir packages/website run build
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: ./.github/actions/cached-install
        with:
          node-version: 24.x
      - run: pnpm exec playwright install --with-deps chromium
      - run: xvfb-run pnpm run test:e2e
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: failure()
        with:
          name: e2e-report
          path: packages/e2e/test-report
